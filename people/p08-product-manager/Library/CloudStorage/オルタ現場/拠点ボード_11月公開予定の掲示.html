<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>オルタ拠点ボード　11月の公開予定</title><style>body{margin:0;background:#f3f6f6;color:#283c40;font-family: "Noto Sans CJK JP",sans-serif}header{background:#006d77;color:white;padding:18px 6%}main{max-width:850px;margin:36px auto;background:white;padding:38px 50px;box-shadow:0 1px 5px #ccd}h1{font-size:27px;color:#006d77;border-bottom:2px solid #006d77;padding-bottom:16px}.meta{background:#eaf3f3;padding:16px 20px;font-size:14px;line-height:1.9}p{line-height:2;margin-top:28px}</style></head><body><header>オルタ現場システムズ株式会社　｜　プロダクト企画　社内掲示</header><main><h1>オルタ拠点ボード　11月の公開予定</h1><div class="meta">掲載者：原田 雅也（プロダクト企画）<br>掲載日：2025年9月29日<br>対象部門：営業・利用支援・導入・開発・品質</div><p>オルタ拠点ボードは、11月7日に公開可否を判定し、確認が通れば11月14日の公開を予定しています。対象期間は暦年2025年Q4／FY2025 Q3です。</p><p>この予定は、閲覧権限と集計の品質確認を完了することが前提です。判定前のため、営業からの対外案内はまだ始めないでください。公開対象や日付について問い合わせがあった場合は、プロダクト企画の石田までお知らせください。</p></main></body></html>
