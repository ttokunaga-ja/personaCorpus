<h1>受付一覧</h1>
<p>受付一覧では、これまでに受け付けた申請を一覧で確認できます。</p>
<p><a href="#period">表示期間について</a></p>
<p><a href="#detail">詳細を確認する</a></p>
<h2 id="period">表示期間について</h2>
<p>受付一覧には、指定した期間の受付が表示されます。探したい受付が表示されないときは、受付日の範囲を指定して一覧を確認してください。</p>
<p>記入例：2024年9月1日から2024年9月30日までの受付を確認する場合、開始日に「2024/09/01」、終了日に「2024/09/30」を入力します。</p>
<h2 id="detail">詳細を確認する</h2>
<p>一覧から確認したい受付の受付番号を選ぶと、受付の詳細を表示します。詳細画面で受付内容を確認できます。</p>
</body></html>
