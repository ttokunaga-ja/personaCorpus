openapi: 3.1.0
info:
  title: Aster Loop Product Alpha R7 Release API
  version: r7.0
  description: Release control for 2026-07-13. Target p95 is 184 ms; ADR-042 requires approval before execution.
servers: [{url: 'https://api.example.invalid'}]
paths:
  /v1/releases:
    post:
      operationId: createRelease
      description: Request a Product Alpha R7 release under the ADR-042 async release gate.
      parameters: [{$ref: '#/components/parameters/RequestId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateRelease'}, example: {version: r7.0, changeSummary: Async gate rollout}}}}
      responses: {'202': {description: Gate pending, content: {application/json: {schema: {$ref: '#/components/schemas/Release'}}}}, '400': {$ref: '#/components/responses/BadRequest'}, '409': {$ref: '#/components/responses/Conflict'}, '422': {$ref: '#/components/responses/Validation'}, '504': {$ref: '#/components/responses/Timeout'}}
    get:
      operationId: listReleases
      description: List releases in stable createdAt then releaseId order.
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses: {'200': {description: Page of releases, content: {application/json: {schema: {$ref: '#/components/schemas/ReleasePage'}}}}}
  /v1/releases/{releaseId}:
    get:
      operationId: getRelease
      description: Get an R7 release and ADR-042 gate status.
      parameters: [{$ref: '#/components/parameters/ReleaseId'}, {$ref: '#/components/parameters/RequestId'}]
      responses: {'200': {description: Release status, content: {application/json: {schema: {$ref: '#/components/schemas/Release'}}}}, '404': {$ref: '#/components/responses/NotFound'}}
components:
  parameters:
    RequestId: {name: X-Request-Id, in: header, description: Correlation identifier, schema: {type: string, maxLength: 64}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, description: Replay-safe create key, schema: {type: string, minLength: 8, maxLength: 128}}
    ReleaseId: {name: releaseId, in: path, required: true, description: Opaque release identifier, schema: {type: string}}
    Cursor: {name: cursor, in: query, description: Opaque exclusive cursor, schema: {type: string}}
    Limit: {name: limit, in: query, description: Page size, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
  schemas:
    CreateRelease: {type: object, required: [version, changeSummary], properties: {version: {type: string, pattern: '^r7\\.'}, changeSummary: {type: string, maxLength: 500}}}
    Release: {type: object, required: [releaseId, product, version, state, createdAt, updatedAt, approvalGate, requestId], properties: {releaseId: {type: string, example: rel_r7_001}, product: {type: string, const: product-alpha}, version: {type: string, example: r7.0}, state: {type: string, enum: [requested, awaiting_approval, approved, running, completed, failed]}, createdAt: {type: string, format: date-time}, updatedAt: {type: string, format: date-time}, approvalGate: {type: string, const: ADR-042}, requestId: {type: string, example: req_r7_fixture_001}}}
    ReleasePage: {type: object, required: [items, requestId], properties: {items: {type: array, items: {$ref: '#/components/schemas/Release'}}, nextCursor: {type: [string, 'null']}, requestId: {type: string}}}
    Error: {type: object, required: [code, message, requestId, retryable], properties: {code: {type: string}, message: {type: string}, requestId: {type: string}, retryable: {type: boolean}, details: {type: object, additionalProperties: {type: string}}}}
  responses:
    BadRequest: {description: Invalid request identity or idempotency key, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Conflict: {description: Idempotency conflict or approval required, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Validation: {description: Validation failed, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Timeout: {description: Retryable upstream timeout, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    NotFound: {description: Release not found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
