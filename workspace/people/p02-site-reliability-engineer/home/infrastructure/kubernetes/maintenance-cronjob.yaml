apiVersion: batch/v1
kind: CronJob
metadata:
  name: northstar-maintenance-summary
  namespace: northstar-production
  labels:
    app.kubernetes.io/name: northstar-maintenance-summary
    app.kubernetes.io/part-of: northstar-transit-cloud
  annotations:
    northstar.example/change-window: "sunday-0300-0330-utc"
spec:
  schedule: "0 3 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: northstar-maintenance-summary
            app.kubernetes.io/part-of: northstar-transit-cloud
        spec:
          serviceAccountName: maintenance-reporter
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: summarizer
              image: registry.example/northstar/maintenance-summary:2026.07
              args: ["--window=weekly", "--format=summary"]
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 10003
                capabilities:
                  drop: ["ALL"]
