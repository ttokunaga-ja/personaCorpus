apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
  namespace: northstar-platform
  labels:
    app.kubernetes.io/name: identity
    app.kubernetes.io/part-of: northstar-transit-cloud
    app.kubernetes.io/component: identity-api
  annotations:
    northstar.example/owner: sre-identity
    northstar.example/change-window: "weekday-0200-0400-utc"
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: identity
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity
        app.kubernetes.io/part-of: northstar-transit-cloud
        app.kubernetes.io/component: identity-api
    spec:
      serviceAccountName: identity-runtime
      automountServiceAccountToken: false
      priorityClassName: northstar-critical
      terminationGracePeriodSeconds: 45
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: identity
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nodepool.northstar.example/workload
                    operator: In
                    values: [platform-services]
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: identity
      containers:
        - name: identity-api
          image: registry.example/northstar/identity:2026.07.13
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 8443
            - name: metrics
              containerPort: 9090
          resources:
            requests:
              cpu: 400m
              memory: 512Mi
            limits:
              cpu: "1500m"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10002
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /readyz
              port: https
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
          startupProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
            periodSeconds: 5
            failureThreshold: 24
          volumeMounts:
            - name: runtime-tmp
              mountPath: /tmp
      volumes:
        - name: runtime-tmp
          emptyDir:
            sizeLimit: 128Mi
