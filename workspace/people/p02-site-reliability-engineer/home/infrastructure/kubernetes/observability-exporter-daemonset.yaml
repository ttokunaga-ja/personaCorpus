apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: northstar-node-observability-exporter
  namespace: northstar-observability
  labels:
    app.kubernetes.io/name: northstar-node-observability-exporter
    app.kubernetes.io/part-of: northstar-transit-cloud
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: northstar-node-observability-exporter
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 10%
  template:
    metadata:
      labels:
        app.kubernetes.io/name: northstar-node-observability-exporter
        app.kubernetes.io/part-of: northstar-transit-cloud
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
    spec:
      serviceAccountName: observability-exporter
      automountServiceAccountToken: false
      priorityClassName: northstar-observability
      tolerations:
        - operator: Exists
          effect: NoSchedule
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: registry.example/northstar/node-observability-exporter:2026.07
          ports:
            - name: metrics
              containerPort: 9100
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10004
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 2
