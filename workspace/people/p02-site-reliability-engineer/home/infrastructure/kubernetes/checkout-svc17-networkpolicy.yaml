apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: checkout-svc17-restricted
  namespace: northstar-production
  labels:
    app.kubernetes.io/name: checkout-svc17
    app.kubernetes.io/part-of: northstar-transit-cloud
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: checkout-svc17
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: regional-gateway
      ports:
        - protocol: TCP
          port: http
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: northstar-platform
          podSelector:
            matchLabels:
              app.kubernetes.io/name: identity
      ports:
        - protocol: TCP
          port: 8443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
