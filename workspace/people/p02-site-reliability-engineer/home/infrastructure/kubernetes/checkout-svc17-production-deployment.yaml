apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-svc17
  namespace: northstar-production
  labels:
    app.kubernetes.io/name: checkout-svc17
    app.kubernetes.io/part-of: northstar-transit-cloud
    app.kubernetes.io/component: checkout-api
  annotations:
    northstar.example/service-summary: "Northstar Transit Cloud / Checkout SVC-17"
    northstar.example/incident-reference: "2026-07-13; error budget 2.4%; INC-260713"
    northstar.example/change-window: "weekday-0200-0400-utc"
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout-svc17
  template:
    metadata:
      labels:
        app.kubernetes.io/name: checkout-svc17
        app.kubernetes.io/part-of: northstar-transit-cloud
        app.kubernetes.io/component: checkout-api
        northstar.example/traffic-tier: regional
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: checkout-svc17-runtime
      automountServiceAccountToken: false
      priorityClassName: northstar-critical
      terminationGracePeriodSeconds: 45
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: checkout-svc17
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: checkout-svc17
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nodepool.northstar.example/workload
                    operator: In
                    values: [regional-services]
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: checkout-svc17
      containers:
        - name: checkout-api
          image: registry.example/northstar/checkout-svc17:2026.07.13
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          env:
            - name: SERVICE_NAME
              value: checkout-svc17
            - name: SERVICE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 8
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 24
          volumeMounts:
            - name: runtime-tmp
              mountPath: /tmp
      volumes:
        - name: runtime-tmp
          emptyDir:
            sizeLimit: 256Mi
