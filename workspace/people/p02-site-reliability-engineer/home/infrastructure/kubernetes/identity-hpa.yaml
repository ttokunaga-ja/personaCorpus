apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: identity
  namespace: northstar-platform
  labels:
    app.kubernetes.io/name: identity
    app.kubernetes.io/part-of: northstar-transit-cloud
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: identity
  minReplicas: 3
  maxReplicas: 9
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 3
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: Percent
          value: 20
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
